<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Diploma Workflow
        {% endblock %}
    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Styles -->

    <style>

        body {
            background: #f5f7fb;
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            width: 260px;
            min-height: 100vh;

            background: #111827;

            color: white;

            position: fixed;

            left: 0;
            top: 0;

            padding: 24px;
        }

        .sidebar h3 {
            font-weight: 700;
            margin-bottom: 30px;
        }

        .sidebar a {
            color: #d1d5db;

            text-decoration: none;

            display: block;

            padding: 12px 14px;

            border-radius: 12px;

            margin-bottom: 10px;

            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
        }

        .main-content {
            margin-left: 280px;
            padding: 32px;
        }

        .dashboard-card {
            background: white;

            border-radius: 20px;

            padding: 24px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.05);

            transition: 0.2s;
        }

        .dashboard-card:hover {
            transform: translateY(-3px);
        }

        .project-status {

            padding: 6px 12px;

            border-radius: 999px;

            font-size: 14px;

            font-weight: 600;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-review {
            background: #fef3c7;
            color: #92400e;
        }

        .status-completed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .timeline-step {
            border-left: 4px solid #3b82f6;

            padding-left: 20px;

            margin-bottom: 24px;
        }

        .timeline-step h6 {
            font-weight: 700;
        }

        .upload-box {
            border: 2px dashed #cbd5e1;

            border-radius: 16px;

            padding: 40px;

            text-align: center;

            background: white;
        }
        .timeline {
            position: relative;
            padding-left: 25px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #e5e7eb;
        }

        .timeline-step {
            position: relative;
            margin-bottom: 20px;
            padding-left: 10px;
        }

        .timeline-step::before {
            content: '';
            position: absolute;
            left: -18px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .timeline-step.done::before {
            background: #22c55e;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3>🎓 Workflow Дипломов</h3>

    <a href="/">Главная</a>

    <a href="/student/dashboard/">
        Мой проект
    </a>

    <a href="{% url 'documents' %}">Документы</a>

    <a href="{% url 'stages' %}">
        Этапы
    </a>

    {% if user.role == 'supervisor' %}
        <a href="{% url 'supervisor_dashboard' %}">Руководитель</a>
    {% endif %}

    <a href="/swagger/">
        API Docs
    </a>

    {% if user.is_staff %}
        <a href="/admin/">Админка</a>
    {% endif %}

    <form action="/logout/" method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-outline-light w-100 mt-4"
        >
            🚪 Выйти
        </button>

    </form>

</div>

<div class="main-content">

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
